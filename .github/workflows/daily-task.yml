name: oopz-daily-task

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 05:20（UTC 21:20）自动执行；可按需修改。
    # GitHub Actions 的 cron 使用 UTC 时间。
    - cron: "20 21 * * *"

jobs:
  daily-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily task
        env:
          OOPZ_PHONE: ${{ secrets.OOPZ_PHONE }}
          OOPZ_PASSWORD: ${{ secrets.OOPZ_PASSWORD }}
          OOPZ_DEVICE_ID: ${{ secrets.OOPZ_DEVICE_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python main.py
